name = "emircyn-portfolio"
compatibility_date = "2025-11-25"
main = "./worker/index.js"
# One public address: emircyn.com. No workers.dev URL and no per-version
# preview URLs; builds are reviewed locally with wrangler dev.
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
# The host check in worker/index.js has to see every request, not only the
# ones that miss a static file.
run_worker_first = true
